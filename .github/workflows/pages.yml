name: Deploy static prototypes to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble public preview
        run: |
          mkdir -p _site/Idea/css _site/Idea/js
          mkdir -p _site/Pharmatech/prototype/css _site/Pharmatech/prototype/js
          cp index.html _site/index.html
          cp Idea/index.html _site/Idea/index.html
          cp Idea/css/styles.css _site/Idea/css/styles.css
          cp Idea/js/app.js _site/Idea/js/app.js
          cp Pharmatech/prototype/index.html _site/Pharmatech/prototype/index.html
          cp Pharmatech/prototype/css/styles.css _site/Pharmatech/prototype/css/styles.css
          cp Pharmatech/prototype/js/app.js _site/Pharmatech/prototype/js/app.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
